<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="ZotPDF is a Zotero plugin that finds open-access PDFs from Unpaywall, PubMed Central and OpenAlex, checks references for retractions, and audits citation metadata.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="wrap bar">
    <a class="brand" href="./"><img src="icon.svg" alt="" width="28" height="28"><span>ZotPDF</span></a>
    <a class="gh" href="{{repo}}">GitHub</a>
  </div>
  <nav class="wrap tabs" aria-label="Documentation">
{{nav}}
  </nav>
</header>
<main class="wrap">
{{content}}
</main>
<footer class="wrap foot">
  ZotPDF {{version}} · MIT and Apache-2.0 · <a href="{{issues}}">Report an issue</a>
</footer>
</body>
</html>
