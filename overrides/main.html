{% extends "base.html" %}

{% block extrahead %}
  <link rel="alternate icon" type="image/x-icon" href="{{ base_url }}/favicon.ico" sizes="48x48">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ base_url }}/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ base_url }}/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="{{ base_url }}/apple-touch-icon.png">
  <link rel="mask-icon" href="{{ base_url }}/safari-pinned-tab.svg" color="#3373b5">
  <link rel="manifest" href="{{ base_url }}/site.webmanifest">
  <meta name="theme-color" content="#3373b5">
  <meta name="msapplication-TileColor" content="#3373b5">
  <meta name="msapplication-TileImage" content="{{ base_url }}/mstile-150x150.png">
  <meta name="msapplication-config" content="{{ base_url }}/browserconfig.xml">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ config.site_name }}">
  <meta property="og:title" content="{{ page.title ~ ' - ' ~ config.site_name if page and page.url and page.title else config.site_name }}">
  <meta property="og:description" content="{{ config.site_description }}">
  <meta property="og:url" content="{{ page.canonical_url if page else config.site_url }}">
  <meta property="og:image" content="{{ config.site_url }}og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="{{ config.site_url }}og.png">
{% endblock %}
